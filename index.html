<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="קדוש">
<meta name="theme-color" content="#142f57">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>הצעות מחיר קדוש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* White and deep muted blue for trust, gold only as a small accent tied to the logo; one light theme by choice.
     Layout: phone app shell — navy top bar, scrolling column on near-white, white bottom tabs. */
  --bg:#f3f5f9;
  --surface:#ffffff;
  --surface-2:#f6f8fc;
  --line:#d8dfe9;
  --text:#132238;
  --muted:#5d6b80;
  --blue:#1f4e8c;
  --blue-dk:#142f57;
  --blue-soft:#eaf0f7;
  --gold:#c59a2e;
  --gold-lt:#e9c873;
  --ok:#1e9a5a;
  --no:#cf4336;
  --warn:#b4720f;
  --display:"Rubik","Heebo",system-ui,-apple-system,sans-serif;
  --body:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
a{color:var(--blue)}
.hidden{display:none!important}

/* top bar */
.topbar{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(8px + var(--safe-t)) 16px 8px;background:linear-gradient(180deg,#1f4e8c,#142f57);color:#fff;border-bottom:2px solid var(--gold);box-shadow:0 2px 14px rgba(20,47,87,.25)}
.topbar img{width:42px;height:auto;border-radius:8px;box-shadow:0 0 0 1.5px rgba(255,255,255,.6)}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:.01em;color:var(--gold-lt)}
.brand span{font-size:12.5px;color:rgba(255,255,255,.8)}
.conn{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:rgba(255,255,255,.88)}
.dot{width:8px;height:8px;border-radius:50%;background:#9fb3d6}
.dot.on{background:#5be39a;box-shadow:0 0 0 3px rgba(91,227,154,.25)}
.dot.wait{background:#ffd166}

main{padding:calc(76px + var(--safe-t)) 16px calc(96px + var(--safe-b));max-width:720px;margin:0 auto}

/* bottom tabs */
.tabs{position:fixed;inset:auto 0 0 0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(19,34,56,.06);padding:6px 6px calc(6px + var(--safe-b))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 0;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;border-radius:10px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--blue);font-weight:700}
.tab.on::before{content:"";position:absolute;top:-6px;width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* blocks */
.stack{display:flex;flex-direction:column;gap:14px}
.head{display:flex;align-items:center;gap:10px;margin:4px 0 2px}
.head h1{font-size:24px;font-weight:800;color:var(--text)}
.head .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 3px rgba(19,34,56,.05)}
.card h2{font-size:16px;font-weight:700;color:var(--blue-dk);display:flex;align-items:center;gap:8px}
.card h2 svg{flex:0 0 20px;width:20px;height:20px}
.card h2 .n{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
.hint{font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.hint svg{flex:0 0 18px;width:18px;height:18px;color:var(--blue);margin-top:2px}
.muted{color:var(--muted)}
.small{font-size:13.5px}

label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted);font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.row2{grid-template-columns:1fr}}
input[type=text],input[type=tel],input[type=email],input[type=search],input:not([type]),textarea,select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
textarea{resize:vertical;min-height:90px;line-height:1.55}
textarea.big{min-height:180px}
input:focus,textarea:focus,select:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(31,78,140,.18)}
::placeholder{color:#8d9ab0}
.check{display:flex;align-items:center;gap:10px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--blue)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15.5px;border:1px solid var(--line);background:#fff;cursor:pointer;text-decoration:none;color:var(--text);min-height:46px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 6px 18px rgba(31,78,140,.22)}
.btn.primary:active{background:var(--blue-dk)}
.btn.big{min-height:56px;font-size:17.5px;border-radius:14px}
.btn.ghost{background:transparent;color:var(--blue-dk)}
.btn.danger{color:var(--no);border-color:rgba(207,67,54,.4);background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns>.btn{flex:1 1 auto}
.iconbtn{background:#fff;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.iconbtn svg{width:20px;height:20px}

/* images */
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumb{position:relative;width:86px;height:86px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(19,34,56,.75);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-top:0;text-align:start;width:100%;color:var(--text)}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums}
.item .amt{font-weight:700;font-size:15px}
.avatar{flex:0 0 42px;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:var(--blue-dk);background:var(--blue-soft);border:1px solid #cbd8ea}
.empty{padding:22px 6px;text-align:center;color:var(--muted);font-size:14.5px}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;border:1px solid var(--line);color:var(--muted);background:#fff;white-space:nowrap}
.st-pending{color:var(--warn);border-color:rgba(180,114,15,.4);background:#fdf4e3}
.st-ok{color:var(--ok);border-color:rgba(30,154,90,.4);background:#e7f6ee}
.st-no{color:var(--no);border-color:rgba(207,67,54,.4);background:#fcebe9}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button.on{color:#fff;background:var(--blue);border-color:var(--blue);font-weight:700}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--blue)}
.stat span{font-size:12.5px;color:var(--muted)}

.banner{border:1px solid #cbd8ea;background:var(--blue-soft);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner svg{flex:0 0 20px;width:20px;height:20px;color:var(--blue)}
.banner.warn{border-color:rgba(207,67,54,.35);background:#fcebe9}
.banner.warn svg{color:var(--no)}
.banner ul{margin:4px 0 0;padding-inline-start:18px}

/* match box */
.match{border-radius:12px;padding:12px;border:1px dashed var(--line);display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.match.existing{border:1px solid rgba(30,154,90,.45);background:#eef9f3}
.match.new{border-color:#c3d2e7;background:var(--blue-soft)}
.match .line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* form sections */
.sec-card{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.sec-card .top{display:flex;gap:8px;align-items:center}
.sec-card input,.sec-card textarea{background:#fff}
.bd-row{display:grid;grid-template-columns:1fr 120px 40px;gap:8px;align-items:start}
.bd-row>.iconbtn{margin-top:5px}
.preset{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.card>summary{cursor:pointer;list-style:none;font-weight:700;color:var(--blue-dk);display:flex;align-items:center;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary svg{width:20px;height:20px}

/* quote actions */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--text);text-decoration:none;text-align:center}
.act svg{width:24px;height:24px;color:var(--blue)}
.act.danger svg{color:var(--no)}
.act:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* client card */
.ccard{background:linear-gradient(150deg,#1f4e8c,#142f57);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 3px 0 var(--gold),0 10px 30px rgba(20,47,87,.28)}
.ccard .who{display:flex;gap:12px;align-items:center}
.ccard .who h1{font-size:22px}
.ccard .avatar{background:#fff;color:var(--blue-dk);border:2px solid var(--gold)}
.ccard a{color:#fff}
.ccard .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.4)}
.ccard .btn.primary{background:#fff;color:var(--blue-dk);border-color:#fff;box-shadow:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:rgba(255,255,255,.75)}
.kv dd{margin:0}

/* overlay, modal, toast */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(15,30,55,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.busy{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;min-width:260px;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 20px 50px rgba(19,34,56,.25)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid #dde5f0;border-top-color:var(--blue);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:460px;max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(19,34,56,.25)}
.modal h3{font-size:18px}
.fpop-who{display:flex;flex-direction:column;gap:2px}
.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.fpop-who b{font-size:17px}
.fpop-msg{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.55;max-height:34vh;overflow:auto}
.danger-card{border-color:#e9b8b2}
.danger-card h2{color:var(--no)}
.btn:disabled{opacity:.45;pointer-events:none}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));background:#132238;color:#fff;padding:11px 16px;border-radius:12px;font-size:14.5px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(19,34,56,.3)}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}*{transition:none!important}}

.btn.rec{background:#fcebe9;color:var(--no);border-color:rgba(207,67,54,.45)}
.dictrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kw{display:inline-block;background:var(--blue-soft);color:var(--blue-dk);border-radius:6px;padding:0 6px;font-weight:700}
.tab .badge{position:absolute;top:0;left:calc(50% + 4px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--no);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.follow{box-shadow:inset 0 3px 0 var(--warn),0 1px 3px rgba(19,34,56,.05)}
.frow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .who{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;background:none;border:0;padding:0;text-align:start;cursor:pointer;color:var(--text)}
.frow .who b{font-size:16px}
.frow .btns>.btn{flex:0 0 auto}
.vatline{font-size:14px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-variant-numeric:tabular-nums}
.vatline b{color:var(--text)}
.finfo{font-size:14px;display:flex;flex-direction:column;gap:8px;background:#fdf4e3;border:1px solid rgba(180,114,15,.35);border-radius:12px;padding:10px 12px}
.finfo .btns>.btn{flex:0 0 auto}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.catbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--blue-dk);cursor:pointer}
.catbtn:active{background:var(--blue-soft)}
ul.fixed{margin:0;padding-inline-start:20px;font-size:15px}
.fld{position:relative;display:block}
.fld>input,.fld>textarea{padding-left:50px}
.micbtn{position:absolute;left:6px;top:6px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .12s,background .12s}
.micbtn svg{width:19px;height:19px;pointer-events:none}
textarea.grow{min-height:0;resize:none;overflow:hidden;line-height:1.5}
.fld.nomic>input,.fld.nomic>textarea{padding-left:14px}
.fld:focus-within>input,.fld:focus-within>textarea{padding-left:92px}
.fld.nomic:focus-within>input,.fld.nomic:focus-within>textarea{padding-left:50px}
.okbtn{position:absolute;left:48px;top:6px;width:38px;height:38px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;visibility:hidden;opacity:0;transition:visibility 0s .6s,opacity 0s .6s}
.fld.nomic .okbtn{left:6px}
.fld:focus-within .okbtn{visibility:visible;opacity:1;transition:none}
.okbtn svg{width:20px;height:20px;pointer-events:none}
.micbtn.rec{background:var(--no);border-color:var(--no);color:#fff;transform:scale(1.18);box-shadow:0 0 0 6px rgba(207,67,54,.2);animation:pulse 1s ease-in-out infinite}
.micbtn.busy{color:transparent;background:#fff}
.micbtn.busy::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:3px solid #dde5f0;border-top-color:var(--blue);animation:spin 1s linear infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(207,67,54,.08)}}
.recpill{position:fixed;z-index:70;top:calc(70px + var(--safe-t));left:50%;transform:translateX(-50%);background:var(--no);color:#fff;font-weight:700;font-size:14.5px;padding:8px 16px;border-radius:999px;display:flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 8px 24px rgba(207,67,54,.35)}
.recpill .rdot{width:10px;height:10px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
/* quote pages (canvas) */
.pages{display:flex;flex-direction:column;gap:12px}
.page{display:block;width:100%;height:auto;border-radius:4px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 24px rgba(19,34,56,.14)}
.page-ph{width:100%;aspect-ratio:794/1123;border-radius:4px;background:#e9eef6;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
</style>
</head>

/* client matching: phone first, then identical name, then partial name suggestions */
function findMatches(name, phone, clients) {
  const p = normPhone(phone), toks = nameTokens(name);
  let strong = null; const cands = [];
  if (p) strong = clients.find(c => normPhone(c.phone) === p) || null;
  if (!strong && toks.length) {
    const key = [...toks].sort().join(' ');
    for (const c of clients) {
      const ct = nameTokens(c.name);
      if (!ct.length || [...ct].sort().join(' ') !== key) continue;
      const cp = normPhone(c.phone);
      if (p && cp && p !== cp) { cands.push({ c, score: 9 }); continue; }
      strong = c; break;
    }
  }
  if (!strong && toks.length) {
    for (const c of clients) {
      if (cands.some(x => x.c === c)) continue;
      const ct = nameTokens(c.name);
      const shared = toks.filter(t => t.length >= 2 && ct.includes(t)).length;
      if (shared > 0 && (shared >= 2 || toks.length === 1 || ct.length === 1)) cands.push({ c, score: shared });
    }
  }
  cands.sort((a, b) => b.score - a.score);
  return { strong, cands: cands.slice(0, 3).map(x => x.c) };
}

const PAL = {

  gold: { ink: '#1c1b18', grey: '#615b4c', line: '#1c1b18', gold: '#c9982a', goldDk: '#8b6a1c', bar: '#d2a232', band: '#080807', priceBg: '#fbf6e6', leader: '#b9b2a0', faint: '#8f8878', rule: '#e4dfd2', grad: ['#6e5112', '#e9c255', '#fff0b5', '#e3b23c', '#6e5112'] }

function docBlocks(q, img) {

function docLayout(q, img) {

    if (y + need > limit && pages[pages.length - 1].some(e => e.b.h > 0)) { pages.push([]); y = contTop; }

/* ---------- export: PDF (built here, no outside library) and image ---------- */
function canvasJpeg(cv, q) { return new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', q || 0.9)); }

  const n = pages.length, A4W = 595.28, A4H = 841.89;
  obj(1, () => put('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => put('<< /Type /Pages /Kids [' + pages.map((_, i) => (3 + 3 * i) + ' 0 R').join(' ') + '] /Count ' + n + ' >>'));
  pages.forEach((p, i) => {
    const po = 3 + 3 * i, co = po + 1, io = po + 2;
    obj(po, () => put('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + A4W + ' ' + A4H + '] /Resources << /XObject << /Im' + i + ' ' + io + ' 0 R >> >> /Contents ' + co + ' 0 R >>'));

  });
  const total = 3 + 3 * n, xref = len;
  let x = 'xref\n0 ' + total + '\n0000000000 65535 f \n';
  for (let i = 1; i < total; i++) x += String(off[i]).padStart(10, '0') + ' 00000 n \n';
  put(x + 'trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');

}
async function makePdf(q) {
  const cvs = await renderDoc(q, 2);
  const pages = [];
  for (const cv of cvs) { const b = await canvasJpeg(cv, 0.9); pages.push({ bytes: new Uint8Array(await b.arrayBuffer()), w: cv.width, h: cv.height }); }

}
async function makeImage(q) {
  const probe = await renderDoc(q, 1);
  const n = probe.length;
  const scale = Math.max(1, Math.min(2, Math.sqrt(15e6 / (PW * PH * n))));
  const cvs = await renderDoc(q, scale);
  if (cvs.length === 1) return canvasJpeg(cvs[0]);
  const all = document.createElement('canvas'); all.width = cvs[0].width; all.height = cvs.reduce((s, c) => s + c.height, 0);

}
function fileBase(q) { return ('הצעת מחיר ' + (q.number || '') + ' ' + (clientNameOf(q) || '')).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim(); }
let pdfPre = null;
const PDF_SKIP = ['sentAt', 'lastFollowUpAt', 'followCount', 'snoozeUntil', 'status', 'updatedAt', 'lastBackupAt', 'nextNumber'];
function pdfKey(q) { try { return JSON.stringify([q, S.settings], (k, v) => PDF_SKIP.includes(k) ? undefined : v); } catch (_) { return String(Date.now()); } }

}

  waPdf: () => sendWaPdf(),
  okField: t => okField(t),
  remind: t => { const q = S.quotes.find(x => x.id === t.dataset.id); if (q) patchQuote(q, { lastFollowUpAt: Date.now(), followCount: (q.followCount || 0) + 1, snoozeUntil: 0, sentAt: q.sentAt || Date.now() }); },
  followMenu: t => followMenu(t.dataset.id),
  // the link must still be on the page when the tap finishes, or the phone will not open WhatsApp: close the window right after
  popRemind: t => { const q = S.quotes.find(x => x.id === t.dataset.id); setTimeout(closeModal, 60); if (q) { S.followSkip[q.id] = Date.now(); patchQuote(q, { lastFollowUpAt: Date.now(), followCount: (q.followCount || 0) + 1, snoozeUntil: 0, sentAt: q.sentAt || Date.now() }); } nextPopup(1500); },
  popSnooze: t => { const q = S.quotes.find(x => x.id === t.dataset.id); closeModal(); if (q) { S.followSkip[q.id] = Date.now(); patchQuote(q, { snoozeUntil: Date.now() + 864e5 }).then(() => toast('אזכיר לך מחר.')); } nextPopup(); },
  popAnswered: t => { S.followSkip[t.dataset.id] = Date.now(); closeModal(); followMenu(t.dataset.id); },
  popLater: () => { const now = Date.now(); popupQueue().forEach(q => { S.followSkip[q.id] = now; }); closeModal(); toast('התזכורות מחכות בלשונית "הצעות".'); },
  setStatus: t => { const q = S.quotes.find(x => x.id === t.dataset.id); closeModal(); if (q) patchQuote(q, { status: t.dataset.s }).then(() => toast(t.dataset.s === 'approved' ? 'סומן כאושרה.' : 'סומן כנדחתה, והמעקב הופסק.')); },
  snooze: t => { const q = S.quotes.find(x => x.id === t.dataset.id); const until = Date.now() + Number(t.dataset.d) * 864e5; closeModal(); if (q) patchQuote(q, { snoozeUntil: until }).then(() => toast('אזכיר לך ב-' + fmtDate(until) + '.')); },
  showFollow: () => { S.qfilter = 'follow'; S.stack = []; S.view = 'quotes'; renderView(); renderChrome(); window.scrollTo(0, 0); },
  shareFile: () => shareFile(),
  downloadFile: () => downloadFile(),
  clearKey: () => { setApiKey(''); renderChrome(); renderView(); toast('המפתח הוסר. המערכת עובדת בעיבוד בסיסי.'); },
  testKey: async () => {
    const k = ($('#s-apiKey') ? $('#s-apiKey').value.trim() : '') || apiKey();
    if (!k) { toast('הדבק מפתח API קודם.'); return; }
    const mdl = $('#modelSeg .on');
    S.ctl = new AbortController(); setBusy('בודק את המפתח…', true);
    try { const r = await callClaude('Reply with only this JSON: {"ok":true}', null, S.ctl.signal, k, mdl ? mdl.dataset.v : null); setBusy(null); toast(r && r.ok ? 'המפתח עובד. לחץ "שמור הגדרות".' : 'התקבלה תשובה לא צפויה, אבל המפתח מחובר.'); }
    catch (e) { setBusy(null); if (e && e.code !== 'cancelled') toast(aiErr(e)); }
    finally { S.ctl = null; }
  }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const f = A[t.dataset.act];
  if (f) { const nav = t.tagName === 'A' && t.getAttribute('href') && t.getAttribute('href') !== '#'; if (!nav) e.preventDefault(); f(t, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.tagName === 'TEXTAREA') fitTa(t);
  if (t.closest && t.closest('#qform') && S.draft) S.draft.fresh = false;
  if (t.id === 'resetWord') { const g = $('#resetGo'); if (g) g.disabled = t.value.trim() !== RESET_WORD; return; }
  if (t.id === 'raw') S.input = t.value;
  else if (t.id === 'f-total' || (t.classList && t.classList.contains('bd-amt'))) updateVatLine();
  else if (t.id === 'qsearch') { S.qsearch = t.value; const l = $('#qlist'); if (l) l.innerHTML = qlistHTML(); }
  else if (t.id === 'csearch') { S.csearch = t.value; const l = $('#clist'); if (l) l.innerHTML = clistHTML(); }
  else if (t.closest && t.closest('#sform')) S.settingsDirty = true;
});
document.addEventListener('toggle', e => { if (e.target && e.target.id === 'dictCard') S.dictOpen = e.target.open; if (e.target && e.target.open) fitAll(e.target); }, true);
// Enter in a one-line box (numbers, phone, date, search) finishes it; in a text box Enter is a new line
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const t = e.target;
  if (t.tagName === 'INPUT' && !['checkbox', 'radio', 'file', 'button', 'submit'].includes(t.type)) { e.preventDefault(); t.blur(); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'importInput') { const f = t.files && t.files[0]; t.value = ''; if (f) doImport(f); return; }
  if (t.id === 'imgInput') {
    const files = [...t.files].filter(f => f.type.startsWith('image/') || /\.(heic|heif|jpe?g|png|webp|gif)$/i.test(f.name));
    collectForm(); S.dictOpen = true;
    const room = Math.max(0, (S.imgMax || 0) - S.images.length);
    if (files.length > room) toast('אפשר עד ' + S.imgMax + ' תמונות בהצעה אחת.');
    files.slice(0, room).forEach(f => S.images.push({ file: f, url: URL.createObjectURL(f) }));
    renderView();
  } else if (t.id === 'f-vat') { updateVatLine();
  } else if ((t.id === 'f-name' || t.id === 'f-phone') && S.draft) {
    collectForm();
    if (S.draft.match.mode === 'new' && t.id === 'f-name') S.draft.match.mode = 'auto';
    const mb = $('#matchBox'); if (mb) mb.innerHTML = matchBoxHTML(S.draft);
  }
});

/* ---------- data ---------- */
function onData(kind) {
  renderChrome();
  if (!S.popStarted && S.loaded.quotes && S.loaded.settings) { S.popStarted = true; nextPopup(900); }
  const v = S.view;
  if (v === 'new' || v === 'form') {
    // settings arrived after an untouched new form was drawn: redraw it with the right number and defaults
    if (kind === 'settings' && v === 'new' && S.draft && !S.draft.id && S.draft.fresh) { S.draft = newDraft(); renderView(); return; }
    const mb = $('#matchBox'); if (mb && S.draft && kind === 'clients') { collectForm(); mb.innerHTML = matchBoxHTML(S.draft); }
  }
  else if (v === 'settings') { if (!S.settingsDirty) renderView(); }
  else { const y = window.scrollY; renderView(); window.scrollTo(0, y); }
}
function softRender() { if (S.view !== 'new' && S.view !== 'form' && !(S.view === 'settings' && S.settingsDirty)) renderView(); }
function dbFail(e) { if (e && (e.code === 'revoked' || e.code === 'not_granted' || e.code === 'capability_disabled')) { S.dbState = 'off'; renderChrome(); softRender(); } }
function startDb(db) {
  S.db = db;
  if (!db) { S.dbState = 'off'; renderChrome(); softRender(); return; }
  S.dbState = 'on'; renderChrome();
  db.collection('clients').limit(1000).onSnapshot(snap => { S.clients = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.loaded.clients = true; onData('clients'); }, dbFail);
  db.collection('quotes').orderBy('createdAt', 'desc').limit(1000).onSnapshot(snap => { S.quotes = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.loaded.quotes = true; onData('quotes'); }, dbFail);
  db.doc('settings/main').onSnapshot(snap => { if (snap.exists) S.settings = cleanSettings({ ...DEFAULT_SETTINGS, ...snap.data() }); S.loaded.settings = true; onData('settings'); }, dbFail);
}
async function init() {
  renderChrome(); renderView();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { pdfPre = null; if (S.view === 'quote') drawPreview(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  let db = null;
  try { db = await makeLocalDb(); } catch (_) { db = null; }
  S.storeMode = db ? db.mode : 'mem';
  startDb(db);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.db) { renderChrome(); softRender(); nextPopup(700); } });
setInterval(maybeFollowPopup, 15 * 6e4);
init();
</script>
</body>
